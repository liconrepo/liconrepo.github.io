name: Refresh LLM models list

# Rebuilds llm-models.json and llm-models.js once a day from public sources
# (models.dev and Hugging Face), and commits them only if something changed.
on:
  schedule:
    - cron: "23 2 * * *"      # every day at 02:23 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write              # needed to commit the generated files

concurrency:
  group: llm-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the models list
        run: python3 tools/build_llm_models.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain llm-models.json llm-models.js)" ]; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llm-models.json llm-models.js
          git commit -m "Refresh LLM models list [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
