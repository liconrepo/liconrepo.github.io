name: Rebuild search index and sitemap

# Keeps search-index.json and sitemap.xml in step with the articles in blog/.
# It runs on every push to main, rebuilds both files, and commits them back
# only if the result is different (so most pushes end with "already up to date").
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the generated files

concurrency:
  group: search-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, so sitemap.xml can use each page's real last-changed date

      - name: Build the index and the sitemap
        run: python3 tools/build_search_index.py

      - name: Commit the index if it changed
        run: |
          if [ -z "$(git status --porcelain search-index.json sitemap.xml)" ]; then
            echo "Generated files are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json sitemap.xml
          git commit -m "Rebuild search index and sitemap [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
